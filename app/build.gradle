plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStorePassword =
        project.findProperty('OTV_RELEASE_STORE_PASSWORD') ?:
        System.getenv('OTV_RELEASE_STORE_PASSWORD') ?: ''
def releaseKeyPassword =
        project.findProperty('OTV_RELEASE_KEY_PASSWORD') ?:
        System.getenv('OTV_RELEASE_KEY_PASSWORD') ?: ''
def deviceReleaseSigning = project.findProperty('deviceReleaseSigning')?.toString()?.toBoolean() ?: false

android {
    namespace 'com.dongpiandi.voicehelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dongpiandi.voicehelper'
        minSdk 33
        targetSdk 34
        versionCode 7
        versionName '1.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'armeabi-v7a', 'x86'
        }
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file('optimaltv-release.keystore')
            storePassword releaseStorePassword
            keyAlias 'optimaltv'
            keyPassword releaseKeyPassword
            enableV1Signing = true
            enableV2Signing = true
            v1SigningEnabled = true
            v2SigningEnabled = true
        }
    }

    buildTypes {
        debug {
            if (deviceReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/{AL2.0,LGPL2.1}']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation project(':voice-core')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
